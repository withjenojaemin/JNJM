<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางงาน JNJM</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>ตารางงาน JNJM</h1>
    <p>ตารางงานประจำเดือน</p>
  </header>

  <main>
    <div class="calendar-header">
      <button onclick="previousMonth()">‹</button>
      <h2 id="monthYear"></h2>
      <button onclick="nextMonth()">›</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>อาทิตย์</th>
          <th>จันทร์</th>
          <th>อังคาร</th>
          <th>พุธ</th>
          <th>พฤหัสบดี</th>
          <th>ศุกร์</th>
          <th>เสาร์</th>
        </tr>
      </thead>

      <tbody id="calendar"></tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
